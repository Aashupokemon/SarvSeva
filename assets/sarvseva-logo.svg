<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="sarvseva-logo-title sarvseva-logo-desc">
  <title id="sarvseva-logo-title">SarvSeva</title>
  <desc id="sarvseva-logo-desc">Circle of Care symbol with three people surrounding a central heart, followed by the SarvSeva wordmark and the tagline Together, We Save Lives.</desc>
  <g transform="translate(64 40)">
    <!-- Open circle of care -->
    <path d="M140 12a128 128 0 0 1 109 61" fill="none" stroke="#116B65" stroke-width="17" stroke-linecap="round"/>
    <path d="M265 100a128 128 0 0 1-20 134" fill="none" stroke="#55A99A" stroke-width="17" stroke-linecap="round"/>
    <path d="M217 253a128 128 0 0 1-153 0" fill="none" stroke="#F2B765" stroke-width="17" stroke-linecap="round"/>
    <path d="M38 234A128 128 0 0 1 13 105" fill="none" stroke="#E87568" stroke-width="17" stroke-linecap="round"/>
    <path d="M32 73A128 128 0 0 1 140 12" fill="none" stroke="#116B65" stroke-width="17" stroke-linecap="round"/>
    <!-- Three welcoming people -->
    <circle cx="140" cy="68" r="22" fill="#116B65"/>
    <path d="M95 137c3-30 20-47 45-47s42 17 45 47" fill="none" stroke="#116B65" stroke-width="18" stroke-linecap="round"/>
    <circle cx="70" cy="155" r="19" fill="#55A99A"/>
    <path d="M39 213c2-25 14-39 31-39 12 0 22 7 28 20" fill="none" stroke="#55A99A" stroke-width="16" stroke-linecap="round"/>
    <circle cx="210" cy="155" r="19" fill="#F2B765"/>
    <path d="M212 194c6-13 16-20 28-20 17 0 29 14 31 39" fill="none" stroke="#D99A3B" stroke-width="16" stroke-linecap="round"/>
    <!-- Shared heart -->
    <path d="M140 213c-7-8-34-25-34-43 0-18 22-23 34-7 12-16 34-11 34 7 0 18-27 35-34 43z" fill="#D93636"/>
  </g>
  <g transform="translate(405 0)">
    <text x="0" y="177" fill="#116B65" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="82" font-weight="750" letter-spacing="2">SARVSEVA</text>
    <text x="4" y="232" fill="#243B40" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="1.6">TOGETHER, WE SAVE LIVES</text>
    <path d="M4 265h300" stroke="#F2B765" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
