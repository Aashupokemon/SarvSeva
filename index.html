<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SarvSeva - Help that reaches you.</title>
  <meta name="theme-color" content="#06222c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/sarvseva-icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/sarvseva-favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/sarvseva-favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="assets/sarvseva-apple-touch-180.png">
  <link rel="preload" href="assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="splash" id="splash" role="status" aria-label="SarvSeva is opening" tabindex="0">
    <div class="splash-scene" aria-hidden="true">
      <svg class="splash-orbit" viewBox="0 0 300 300">
        <path class="arc arc-1" d="M150 22a128 128 0 0 1 109 61"/>
        <path class="arc arc-2" d="M275 110a128 128 0 0 1-20 134"/>
        <path class="arc arc-3" d="M227 263a128 128 0 0 1-153 0"/>
        <path class="arc arc-4" d="M48 244A128 128 0 0 1 23 115"/>
        <path class="arc arc-5" d="M42 83A128 128 0 0 1 150 22"/>
      </svg>

      <svg class="splash-figures" viewBox="0 0 300 300">
        <!-- helper walking in from the right -->
        <g class="figure helper">
          <circle class="head" cx="216" cy="112" r="17"/>
          <path class="torso" d="M196 148c0-16 9-25 20-25s20 9 20 25v36h-40z"/>
          <path class="arm" d="M201 147c-11-3-20-9-27-17"/>
          <path class="arm arm-back" d="M237 150c8 6 12 14 13 24"/>
          <path class="leg" d="M203 184v34"/>
          <path class="leg" d="M229 184v34"/>
        </g>

        <!-- elder seated, waiting -->
        <g class="figure elder">
          <circle class="head" cx="90" cy="150" r="16"/>
          <path class="torso" d="M71 184c0-14 8-22 19-22s19 8 19 22v26H71z"/>
          <path class="shawl" d="M71 190c7-11 31-11 38 0"/>
          <path class="leg" d="M77 210h30"/>
          <path class="cane" d="M114 198l6 26"/>
        </g>

        <!-- child waving hello -->
        <g class="figure child">
          <circle class="head" cx="140" cy="184" r="10"/>
          <path class="torso" d="M130 206c0-10 4-15 10-15s10 5 10 15v16h-20z"/>
          <path class="arm wave" d="M149 194c6-6 8-13 6-19"/>
          <path class="leg" d="M135 222v14"/>
          <path class="leg" d="M145 222v14"/>
        </g>

        <!-- the shared heart, passed from helper to elder -->
        <path class="splash-heart" d="M150 138c-5-6-24-18-24-30 0-13 15-16 24-5 9-11 24-8 24 5 0 12-19 24-24 30z"/>

        <!-- sparks travelling around the circle of care -->
        <circle class="spark spark-1" cx="212" cy="46" r="3.6"/>
        <circle class="spark spark-2" cx="268" cy="205" r="3.2"/>
        <circle class="spark spark-3" cx="60" cy="252" r="3.2"/>
        <circle class="spark spark-4" cx="36" cy="92" r="3.6"/>
        <circle class="spark spark-5" cx="128" cy="24" r="2.8"/>
        <circle class="spark spark-6" cx="246" cy="126" r="2.8"/>
      </svg>
    </div>

    <h1 class="splash-word" aria-label="SarvSeva">
      <span style="--i:0">S</span><span style="--i:1">a</span><span style="--i:2">r</span><span style="--i:3">v</span><span style="--i:4">S</span><span style="--i:5">e</span><span style="--i:6">v</span><span style="--i:7">a</span>
    </h1>
    <p class="splash-tag">Together, We Save Lives</p>
    <p class="splash-hint">Tap to continue</p>
  </div>

  <div class="bg-wash" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <button class="icon-btn" id="home-btn" type="button" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M3.4 11 12 3.8 20.6 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5.9 10.2v9.1h12.2v-9.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M10.2 19.3v-4.5h3.6v4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>

    <div class="menu">
      <button class="icon-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu-panel" aria-haspopup="true" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </button>
      <nav class="menu-panel" id="menu-panel" hidden aria-label="More pages"></nav>
    </div>

    <div class="brand">
      <span class="brand-chip">
        <img class="brand-logo" src="assets/sarvseva-mark.svg" alt="SarvSeva" width="288" height="288" decoding="async">
      </span>
      <span class="brand-name">SarvSeva</span>
    </div>

    <div class="header-shell"></div>

    <nav class="site-nav" aria-label="Main">
      <a class="tab" href="#/emergency" data-tab="emergency">
        <span class="tab-icon tab-icon-alert" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="13" height="13"><path d="M8 2 15 14H1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.2v3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.9" r="0.85" fill="currentColor"/></svg>
        </span>
        <span data-tab-label>Emergency</span>
      </a>
      <a class="tab" href="#/aid" data-tab="aid">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="13" height="13"><path d="M6.3 2h3.4v4.3H14v3.4H9.7V14H6.3V9.7H2V6.3h4.3Z" fill="currentColor"/></svg>
        </span>
        <span data-tab-label>First aid</span>
      </a>
    </nav>


  </header>
  <div class="net-status" id="net-status" role="status" aria-live="polite" hidden></div>

  <main id="main" class="container" role="main"></main>

  <footer class="site-footer" id="site-footer">
    <p class="footer-note">SarvSeva app · demo build</p>
    <p class="disclaimer">SarvSeva is not an emergency service. If someone is in immediate danger, call local emergency services (for example 112).</p>

    <nav class="footer-legal" aria-label="Legal">
      <a class="footer-link" href="#/terms" data-footlink="terms">Terms &amp; Conditions</a>
      <a class="footer-link" href="#/operations" data-footlink="ops">How we operate</a>
    </nav>

    <div class="footer-social">
      <span class="footer-social-label" data-footlink="social">Follow SarvSeva</span>
      <ul class="social-row">
        <li><a class="social-link" href="https://www.instagram.com/sarvseva" target="_blank" rel="noopener noreferrer" aria-label="SarvSeva on Instagram">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.1" cy="6.9" r="1.15" fill="currentColor"/></svg>
        </a></li>
        <li><a class="social-link" href="https://x.com/sarvseva" target="_blank" rel="noopener noreferrer" aria-label="SarvSeva on X">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 4h4.4l4.1 5.6L17.4 4H20l-6.2 7.6L20.4 20H16l-4.4-6-5 6H4l6.6-7.9Z" fill="currentColor"/></svg>
        </a></li>
        <li><a class="social-link" href="https://www.youtube.com/@sarvseva" target="_blank" rel="noopener noreferrer" aria-label="SarvSeva on YouTube">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><rect x="2.6" y="5.6" width="18.8" height="12.8" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.4 9.3 15.2 12l-4.8 2.7Z" fill="currentColor"/></svg>
        </a></li>
        <li><a class="social-link" href="https://www.linkedin.com/company/sarvseva" target="_blank" rel="noopener noreferrer" aria-label="SarvSeva on LinkedIn">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7.3 10.2v6.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="7.3" cy="7.4" r="1.15" fill="currentColor"/><path d="M11.4 16.6v-3.4c0-1.4.9-2.3 2.2-2.3s2.2.9 2.2 2.3v3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </a></li>
      </ul>
    </div>
  </footer>

  <audio id="bg-music" src="assets/sarvseva-music.mp3" loop preload="none"></audio>
  <div class="dock" role="group" aria-label="Display and sound">
    <button class="dock-btn" id="theme-btn" type="button" aria-pressed="false" title="Switch to light theme" aria-label="Switch to light theme">
      <span class="dock-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 3.8a8.2 8.2 0 0 0 0 16.4Z" fill="currentColor" opacity="0.9"/>
        </svg>
      </span>
      <span class="dock-label">Light</span>
    </button>
    <button class="dock-btn" id="lang-toggle" type="button" aria-pressed="false" aria-label="Switch language">
      <span class="dock-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.7 12h16.6M12 3.6c2.4 2.4 3.6 5.2 3.6 8.4S14.4 18 12 20.4M12 3.6C9.6 6 8.4 8.8 8.4 12s1.2 6 3.6 8.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </span>
      <span class="dock-label">हिंदी</span>
    </button>
    <button type="button" class="music-btn" id="music-btn" aria-pressed="false">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="music-label">Play music</span>
    </button>
  </div>

  <script type="application/json" id="app-state">{"locale":"en"}</script>
  <script type="module" src="app.js"></script>
</body>
</html>
